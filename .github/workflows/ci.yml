name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI nie wykonuje eksperymentów online ani pełnego treningu AutoGluona.
env:
  WANDB_MODE: disabled
  WANDB_SILENT: "true"

jobs:
  checks:
    name: pre-commit, testy i baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Środowisko conda z environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Cache pip (Sprinty 2 i 3)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements/preflight-s2.txt', 'requirements/preflight-s3.txt', 'constraints.txt') }}

      - name: Instalacja zależności Sprintów 2 i 3
        run: |
          python -m pip install -r requirements/preflight-s2.txt -c constraints.txt
          python -m pip install -r requirements/preflight-s3.txt -c constraints.txt
          python -m pip check

      - name: Instalacja pakietu projektu
        run: python -m pip install --no-deps -e .

      - name: Kedro — sprawdzenie rejestru pipeline'ów
        run: kedro registry list

      - name: Wersje bibliotek
        run: python scripts/check_env.py

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: pytest
        run: pytest

      - name: Stan projektu
        id: status
        run: python scripts/project_status.py | tee -a "$GITHUB_OUTPUT"

      - name: Baseline na próbce CI (notebook 02)
        if: steps.status.outputs.baseline_done == 'true'
        env:
          ASI_DATA_MODE: sample
          ASI_METRICS_PATH: ${{ runner.temp }}/metrics_ci.json
          MPLBACKEND: Agg
        run: |
          python scripts/run_notebook.py notebooks/02_baseline.ipynb
          python scripts/check_metrics.py "$ASI_METRICS_PATH" --data-mode sample

      - name: Raport Definition of Done (Sprint 1)
        if: always()
        run: python scripts/check_dod.py --sprint 1

      # Testy nodów i pakietu modelu dodaje zespół w tests/; pytest je wykrywa.
      # S2: `kedro run --env ci` należy uruchamiać na próbce CI po ukończeniu pipeline'u.
      # Nie uruchamiamy go bezwarunkowo w pustym szablonie (brak nodów).
      # S3: testy zapisu i odczytu modelu bez logowania do W&B ani treningu AutoGluona.
      # S4: testy API (tests/api/) bez prawdziwego modelu i bazy danych.
      # S6 (OPTIONAL): deploy z CI jako osobny workflow.
